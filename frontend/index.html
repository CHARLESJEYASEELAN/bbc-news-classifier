<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC News LSTM Prediction</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container shadow-lg">
        <h2>BBC News LSTM Prediction Engine</h2>
        <form onsubmit="predict(); return false;">
            <div class="mb-3">
                <label for="newsText" class="form-label">Paste your news article here:</label>
                <textarea id="newsText" class="form-control" rows="6" placeholder="Paste your news article here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Predict Category</button>
        </form>
        <div id="result"></div>
    </div>
    <!-- Bootstrap JS (optional, for components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function predict() {
            const text = document.getElementById('newsText').value;
            document.getElementById('result').innerText = 'Predicting...';
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const data = await response.json();
            document.getElementById('result').innerText = 'Predicted Category: ' + data.prediction;
        }
    </script>
</body>
</html>
